name: Astro Avyug - Automatic AI Blog EN + HI

on:
  schedule:
    - cron: "30 3 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Hindi and English blogs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/auto_blog_multilang.py

      - name: Commit and push
        run: |
          git config user.name "Astro Avyug Blog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blog/ en/blog/ hi/blog/ sitemap.xml feed.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Publish Astro Avyug Hindi and English AI blogs"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
