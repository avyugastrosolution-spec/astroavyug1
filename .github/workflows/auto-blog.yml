name: Astro Avyug - Automatic AI Blog

on:
  schedule:
    - cron: "30 3 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate blog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/auto_blog.py
      - name: Commit and push
        run: |
          git config user.name "Astro Avyug Blog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish new Astro Avyug AI blog"
          git push
