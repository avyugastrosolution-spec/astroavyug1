<style>

:root{
  --bg:#05040b;
  --bg2:#11091f;
  --gold:#e9bf68;
  --gold2:#fff0b8;
  --purple:#925bd6;
  --purple2:#b989ed;
  --blue:#456fd0;
  --pink:#d66fae;
  --white:#fff;
  --muted:#d8d0e4;
  --line:rgba(233,191,104,.22);
  --shadow:0 25px 70px rgba(0,0,0,.48);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  overflow-x:hidden;

  color:var(--white);

  font-family:Georgia,"Times New Roman",serif;

  line-height:1.7;

  background:
    radial-gradient(circle at 10% 10%,rgba(130,70,200,.30),transparent 27%),
    radial-gradient(circle at 90% 12%,rgba(55,90,190,.25),transparent 28%),
    radial-gradient(circle at 50% 50%,rgba(233,191,104,.06),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(180,60,130,.20),transparent 35%),
    linear-gradient(135deg,#030208,#0b0615,#12091f,#05040b);
}

body::before{
  content:"";

  position:fixed;
  inset:0;

  z-index:-5;

  pointer-events:none;

  background-image:
    radial-gradient(circle,#fff 1px,transparent 1px),
    radial-gradient(circle,#e9bf68 .8px,transparent .8px),
    radial-gradient(circle,#a77bd7 .7px,transparent .7px);

  background-size:
    95px 95px,
    145px 145px,
    185px 185px;

  animation:starMove 35s linear infinite;

  opacity:.30;
}

@keyframes starMove{

  from{
    background-position:
      0 0,
      30px 50px,
      70px 20px;
  }

  to{
    background-position:
      95px 190px,
      -120px 160px,
      180px -90px;
  }

}

a{
  color:inherit;
  text-decoration:none;
}


/* ================= FLOATING PARTICLES ================= */

.particle{
  position:fixed;

  width:4px;
  height:4px;

  border-radius:50%;

  background:#e9bf68;

  box-shadow:
    0 0 12px #e9bf68;

  pointer-events:none;

  z-index:-1;

  opacity:.45;
}

.p1{
  left:8%;
  top:35%;

  animation:float1 8s ease-in-out infinite;
}

.p2{
  left:20%;
  top:70%;

  animation:float2 11s ease-in-out infinite;
}

.p3{
  right:12%;
  top:32%;

  animation:float1 10s ease-in-out infinite reverse;
}

.p4{
  right:25%;
  top:72%;

  animation:float2 9s ease-in-out infinite reverse;
}

.p5{
  left:50%;
  top:25%;

  animation:float1 7s ease-in-out infinite;
}

@keyframes float1{

  0%,100%{
    transform:translate(0,0) scale(.7);
  }

  50%{
    transform:translate(30px,-50px) scale(1.4);
  }

}

@keyframes float2{

  0%,100%{
    transform:translate(0,0) scale(.6);
  }

  50%{
    transform:translate(-35px,-70px) scale(1.3);
  }

}


/* ================= TOP BAR ================= */

.topbar{
  text-align:center;

  padding:9px 15px;

  font-size:12px;

  letter-spacing:2px;

  color:#f8dfaa;

  background:rgba(0,0,0,.28);

  border-bottom:
    1px solid rgba(233,191,104,.12);
}


/* ================= NAV ================= */

nav{
  position:sticky;

  top:0;

  z-index:1000;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:14px 5%;

  background:
    rgba(5,4,12,.72);

  backdrop-filter:blur(18px);

  border-bottom:
    1px solid rgba(233,191,104,.18);

  box-shadow:
    0 10px 30px rgba(0,0,0,.20);
}

.brand{
  font-size:23px;

  font-weight:800;

  letter-spacing:1px;

  color:var(--gold2);

  text-shadow:
    0 0 12px rgba(233,191,104,.30),
    0 0 30px rgba(141,91,211,.18);

  animation:
    brandGlow 4s ease-in-out infinite;
}

@keyframes brandGlow{

  0%,100%{
    text-shadow:
      0 0 12px rgba(233,191,104,.25),
      0 0 30px rgba(141,91,211,.12);
  }

  50%{
    text-shadow:
      0 0 18px rgba(233,191,104,.55),
      0 0 40px rgba(141,91,211,.25);
  }

}

.home-btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:10px 20px;

  border-radius:30px;

  color:var(--gold2);

  border:
    1px solid rgba(233,191,104,.65);

  background:
    linear-gradient(
      135deg,
      rgba(233,191,104,.12),
      rgba(141,91,211,.08)
    );

  transition:.35s;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.10),
    0 8px 25px rgba(0,0,0,.25);
}

.home-btn:hover{
  transform:translateY(-3px);

  color:#140e07;

  background:
    linear-gradient(
      135deg,
      #ffe5a1,
      #d99d45
    );

  box-shadow:
    0 12px 35px rgba(233,191,104,.28);
}


/* ================= HERO ================= */

.hero{
  position:relative;

  max-width:1200px;

  margin:auto;

  padding:100px 20px 80px;

  text-align:center;
}


/* ================= TAROT ORBIT ================= */

.tarot-orbit{
  position:absolute;

  width:370px;
  height:370px;

  left:50%;
  top:55px;

  transform:translateX(-50%);

  border:
    1px solid rgba(233,191,104,.13);

  border-radius:50%;

  box-shadow:
    0 0 90px rgba(141,91,211,.08),
    inset 0 0 60px rgba(233,191,104,.04);

  animation:
    orbitSpin 18s linear infinite;

  pointer-events:none;
}

.tarot-orbit::before{
  content:"✦";

  position:absolute;

  left:50%;
  top:-22px;

  transform:translateX(-50%);

  color:#ffe5a1;

  font-size:29px;

  text-shadow:
    0 0 10px #e9bf68,
    0 0 30px #925bd6;

  animation:
    tarotStar 2s ease-in-out infinite;
}

.tarot-orbit::after{
  content:"☾";

  position:absolute;

  right:-13px;
  bottom:28px;

  color:#b989ed;

  font-size:29px;

  text-shadow:
    0 0 15px #925bd6;

  animation:
    moonGlow 3s ease-in-out infinite;
}

@keyframes orbitSpin{

  from{
    transform:translateX(-50%) rotate(0deg);
  }

  to{
    transform:translateX(-50%) rotate(360deg);
  }

}

@keyframes tarotStar{

  0%,100%{
    transform:translateX(-50%) scale(.8);
    opacity:.5;
  }

  50%{
    transform:translateX(-50%) scale(1.3);
    opacity:1;
  }

}

@keyframes moonGlow{

  0%,100%{
    opacity:.5;
  }

  50%{
    opacity:1;
    text-shadow:
      0 0 10px #925bd6,
      0 0 30px #b989ed;
  }

}


/* ================= EYEBROW ================= */

.eyebrow{
  position:relative;

  z-index:2;

  display:inline-block;

  padding:8px 20px;

  border-radius:40px;

  color:var(--gold2);

  font-size:12px;

  letter-spacing:2.5px;

  border:
    1px solid rgba(233,191,104,.30);

  background:
    linear-gradient(
      135deg,
      rgba(233,191,104,.08),
      rgba(141,91,211,.10)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 10px 30px rgba(0,0,0,.18);

  margin-bottom:30px;

  animation:
    fadeDown 1s ease both;
}

@keyframes fadeDown{

  from{
    opacity:0;
    transform:translateY(-20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* ================= 3D HEADLINE ================= */

.main-title{
  position:relative;

  z-index:2;

  display:inline-block;

  font-size:
    clamp(48px,8vw,94px);

  line-height:1.05;

  font-weight:900;

  letter-spacing:2px;

  margin-bottom:28px;

  background:
    linear-gradient(
      180deg,
      #fffdf0 0%,
      #fff0b5 15%,
      #e9bf68 36%,
      #bd7d31 58%,
      #fff0b8 78%,
      #9c6126 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  text-shadow:
    0 2px 0 #82551f,
    0 4px 0 #613d17,
    0 7px 0 #39230e,
    0 11px 22px rgba(0,0,0,.85),
    0 0 30px rgba(233,191,104,.38),
    0 0 70px rgba(141,91,211,.20);

  filter:
    drop-shadow(0 10px 12px rgba(0,0,0,.45));

  animation:
    titleFloat 4s ease-in-out infinite,
    titleAppear 1.2s ease both;
}

.main-title::before{
  content:"";

  position:absolute;

  width:125%;
  height:125%;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:
    radial-gradient(
      ellipse,
      rgba(233,191,104,.11),
      transparent 65%
    );

  filter:blur(20px);

  z-index:-1;

  animation:
    titleAura 4s ease-in-out infinite;
}

.main-title::after{
  content:"";

  position:absolute;

  left:50%;
  bottom:-18px;

  width:220px;
  height:3px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ffe5a1,
      #e9bf68,
      #ffe5a1,
      transparent
    );

  box-shadow:
    0 0 10px #e9bf68,
    0 0 30px rgba(233,191,104,.60);

  animation:
    lineGlow 3s ease-in-out infinite;
}

@keyframes titleFloat{

  0%,100%{
    transform:
      translateY(0)
      perspective(900px)
      rotateX(0deg);
  }

  50%{
    transform:
      translateY(-7px)
      perspective(900px)
      rotateX(3deg);
  }

}

@keyframes titleAppear{

  from{
    opacity:0;

    transform:
      scale(.85)
      translateY(30px);

    filter:blur(8px);
  }

  to{
    opacity:1;

    transform:
      scale(1);

    filter:blur(0);
  }

}

@keyframes titleAura{

  0%,100%{
    opacity:.5;

    transform:
      translate(-50%,-50%)
      scale(.95);
  }

  50%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.08);
  }

}

@keyframes lineGlow{

  0%,100%{
    opacity:.6;
    width:150px;
  }

  50%{
    opacity:1;
    width:240px;
  }

}


/* ================= HERO TEXT ================= */

.hero h2{
  position:relative;

  z-index:2;

  color:#e9dff2;

  font-size:
    clamp(17px,3vw,27px);

  font-weight:400;

  margin-bottom:18px;

  animation:
    fadeUp 1s .25s ease both;
}

.hero-text{
  position:relative;

  z-index:2;

  max-width:820px;

  margin:auto;

  color:var(--muted);

  font-size:16px;

  animation:
    fadeUp 1s .45s ease both;
}

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(25px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* ================= BUTTONS ================= */

.contact-buttons{
  position:relative;

  z-index:3;

  display:flex;

  justify-content:center;
  align-items:center;

  flex-wrap:wrap;

  gap:13px;

  margin-top:32px;

  animation:
    fadeUp 1s .65s ease both;
}

.btn{
  position:relative;

  overflow:hidden;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:12px 24px;

  border-radius:30px;

  font-family:inherit;

  font-size:14px;

  border:1px solid transparent;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    0 8px 25px rgba(0,0,0,.28);

  transition:.35s;
}

.btn::before{
  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:60%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.30),
      transparent
    );

  transform:skewX(-20deg);

  transition:.6s;
}

.btn:hover::before{
  left:140%;
}

.btn:hover{
  transform:
    translateY(-4px)
    scale(1.02);

  box-shadow:
    0 14px 35px rgba(0,0,0,.38),
    0 0 25px rgba(233,191,104,.14);
}

.whatsapp{
  color:#041b0d;

  background:
    linear-gradient(
      135deg,
      #63f69a,
      #25d366
    );

  border-color:#62ef91;
}

.instagram{
  color:#ffe9bc;

  background:
    linear-gradient(
      135deg,
      rgba(233,191,104,.12),
      rgba(141,91,211,.14)
    );

  border-color:
    rgba(233,191,104,.55);
}

.home{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.07),
      rgba(141,91,211,.08)
    );

  border-color:
    rgba(255,255,255,.25);
}


/* ================= CONTAINER ================= */

.container{
  width:min(1100px,92%);

  margin:auto;
}


/* ================= CONTENT CARD ================= */

.content-card{
  position:relative;

  overflow:hidden;

  margin-bottom:35px;

  padding:42px;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(27,19,44,.82),
      rgba(11,8,20,.75)
    );

  border:
    1px solid rgba(233,191,104,.20);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 25px 70px rgba(0,0,0,.42);

  backdrop-filter:blur(18px);

  animation:
    cardReveal .9s ease both;
}

.content-card:nth-child(2){
  animation-delay:.15s;
}

.content-card:nth-child(3){
  animation-delay:.25s;
}

.content-card:nth-child(4){
  animation-delay:.35s;
}

@keyframes cardReveal{

  from{
    opacity:0;
    transform:translateY(35px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.content-card::before{
  content:"";

  position:absolute;

  width:260px;
  height:260px;

  right:-120px;
  top:-130px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(233,191,104,.10),
      transparent 70%
    );

  pointer-events:none;

  animation:
    cardGlow 6s ease-in-out infinite;
}

@keyframes cardGlow{

  0%,100%{
    opacity:.5;
  }

  50%{
    opacity:1;
  }

}


/* ================= SECTION TITLE ================= */

.section-title{
  position:relative;

  color:var(--gold2);

  font-size:30px;

  margin-bottom:18px;

  text-shadow:
    0 2px 12px rgba(233,191,104,.16);
}

.section-title::after{
  content:"";

  display:block;

  width:75px;
  height:2px;

  margin-top:9px;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      transparent
    );

  box-shadow:
    0 0 10px rgba(233,191,104,.35);
}

.content-card p{
  color:var(--muted);

  margin-bottom:18px;
}

.highlight{
  color:#fff2c8;

  font-weight:bold;
}


/* ================= TAROT CARDS ================= */

.tarot-showcase{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:25px;

  margin:35px auto 15px;

  perspective:1000px;
}

.tarot-card{
  position:relative;

  width:125px;
  height:190px;

  border-radius:14px;

  border:
    1px solid rgba(233,191,104,.65);

  background:
    radial-gradient(
      circle at center,
      rgba(141,91,211,.32),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #1a1030,
      #080611
    );

  box-shadow:
    0 15px 35px rgba(0,0,0,.45),
    inset 0 0 25px rgba(233,191,104,.07);

  transform-style:preserve-3d;

  transition:.5s;

  animation:
    tarotFloat 4s ease-in-out infinite;
}

.tarot-card:nth-child(2){
  animation-delay:.7s;

  transform:
    translateY(-15px)
    rotateY(0deg);
}

.tarot-card:nth-child(3){
  animation-delay:1.4s;
}

.tarot-card:hover{
  transform:
    translateY(-18px)
    rotateY(12deg)
    rotateX(4deg)
    scale(1.06);

  box-shadow:
    0 25px 50px rgba(0,0,0,.55),
    0 0 30px rgba(233,191,104,.18);
}

.tarot-card::before{
  content:"✦";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    translateZ(20px);

  font-size:45px;

  color:var(--gold2);

  text-shadow:
    0 0 12px var(--gold),
    0 0 35px var(--purple);
}

.tarot-card::after{
  content:"";

  position:absolute;

  inset:9px;

  border:
    1px solid rgba(233,191,104,.30);

  border-radius:9px;

  pointer-events:none;
}

@keyframes tarotFloat{

  0%,100%{
    transform:
      translateY(0)
      rotateY(-4deg);
  }

  50%{
    transform:
      translateY(-13px)
      rotateY(4deg);
  }

}


/* ================= GRIDS ================= */

.topic-grid,
.benefits-grid,
.related-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

  margin-top:28px;
}

.topic,
.benefit,
.related{
  position:relative;

  overflow:hidden;

  padding:25px;

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.018)
    );

  border:
    1px solid rgba(233,191,104,.18);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 13px 35px rgba(0,0,0,.27);

  transition:.45s;

  transform:
    perspective(900px)
    translateZ(0);
}

.topic::before,
.benefit::before,
.related::before{
  content:"";

  position:absolute;

  width:120px;
  height:120px;

  top:-70px;
  right:-60px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(233,191,104,.11),
      transparent 70%
    );
}

.topic:hover,
.benefit:hover,
.related:hover{
  transform:
    perspective(900px)
    translateY(-9px)
    rotateX(3deg)
    rotateY(-1deg);

  border-color:
    rgba(233,191,104,.65);

  box-shadow:
    0 22px 48px rgba(0,0,0,.40),
    0 0 30px rgba(233,191,104,.11);
}

.icon{
  font-size:31px;

  margin-bottom:10px;

  filter:
    drop-shadow(0 4px 8px rgba(0,0,0,.4));

  animation:
    iconFloat 4s ease-in-out infinite;
}

@keyframes iconFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }

}

.topic h3,
.benefit h3,
.related h3{
  position:relative;

  color:var(--gold2);

  font-size:18px;

  margin-bottom:8px;
}

.topic p,
.benefit p,
.related p{
  font-size:14px;

  margin:0;
}


/* ================= STEPS ================= */

.steps{
  display:grid;

  gap:16px;

  margin-top:25px;
}

.step{
  display:flex;

  gap:18px;

  align-items:flex-start;

  padding:21px;

  border-left:
    2px solid var(--gold);

  border-radius:
    0 17px 17px 0;

  background:
    linear-gradient(
      90deg,
      rgba(233,191,104,.07),
      rgba(233,191,104,.015)
    );

  transition:.35s;
}

.step:hover{
  transform:translateX(7px);

  border-left-color:#ffe9ad;

  box-shadow:
    0 8px 25px rgba(0,0,0,.20);
}

.step-number{
  min-width:40px;

  height:40px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:var(--gold2);

  border:
    1px solid var(--gold);

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,.16),
      rgba(233,191,104,.08)
    );

  box-shadow:
    0 0 18px rgba(233,191,104,.12);
}

.step h3{
  color:#fff;

  margin-bottom:5px;

  font-size:18px;
}


/* ================= NOTE ================= */

.note{
  margin-top:26px;

  padding:21px;

  border-radius:18px;

  color:#ded5e7;

  background:
    linear-gradient(
      135deg,
      rgba(233,191,104,.055),
      rgba(141,91,211,.055)
    );

  border:
    1px solid rgba(233,191,104,.20);

/* ================= CTA ================= */

.cta{
  position:relative;

  overflow:hidden;

  text-align:center;

  padding:55px 25px;

  margin:48px 0;

  border-radius:30px;

  border:
    1px solid rgba(233,191,104,.25);

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(233,191,104,.12),
      transparent 45%
    ),
    linear-gradient(
      135deg,
      rgba(19,12,34,.92),
      rgba(8,6,15,.90)
    );

  box-shadow:var(--shadow);
}

.cta::before{
  content:"✦";

  position:absolute;

  left:12%;
  top:25%;

  color:var(--gold);

  font-size:29px;

  animation:
    tarotStar 2.5s ease-in-out infinite;
}

.cta::after{
  content:"☾";

  position:absolute;

  right:12%;
  bottom:25%;

  color:#a77bd7;

  font-size:29px;

  animation:
    moonGlow 3s ease-in-out infinite;
}

.cta h2{
  position:relative;

  z-index:2;

  color:var(--gold2);

  font-size:34px;

  margin-bottom:13px;

  text-shadow:
    0 0 22px rgba(233,191,104,.18);
}

.cta p{
  position:relative;

  z-index:2;

  max-width:700px;

  margin:
    0 auto 27px;

  color:var(--muted);
}

    rgba(0,0,0,.12);
