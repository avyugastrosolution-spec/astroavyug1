<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Career Guidance | Astrology Career Consultation | Astro Avyug</title>

  <meta name="description" content="Personalized Career Guidance by Astro Avyug. Explore career direction, job change, professional growth, business decisions, education and career timing through traditional Vedic astrology.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#07050f">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="canonical" href="https://astroavyug.com/services/career-guidance.html">
  <link rel="icon" type="image/png" href="/favicon.png">

  <meta property="og:title" content="Career Guidance | Astro Avyug">
  <meta property="og:description" content="Personalized astrology-based career guidance for professional direction, job changes, opportunities and growth.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://astroavyug.com/services/career-guidance.html">
  <meta property="og:image" content="https://astroavyug.com/favicon.png">

  <style>
    :root{
      --bg:#07050f;
      --bg2:#10091d;
      --gold:#e9bf68;
      --gold2:#ffe9ad;
      --gold3:#b8782f;
      --purple:#8d5bd3;
      --blue:#416ecb;
      --white:#fff;
      --muted:#d8d0e4;
      --line:rgba(233,191,104,.22);
      --glass:rgba(18,13,31,.72);
      --shadow:0 25px 70px rgba(0,0,0,.48);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      color:var(--white);
      font-family:Georgia,"Times New Roman",serif;
      line-height:1.7;

      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(118,71,190,.32),
          transparent 27%
        ),
        radial-gradient(
          circle at 88% 14%,
          rgba(48,86,170,.26),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 48%,
          rgba(233,191,104,.07),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(101,52,154,.26),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #04030a 0%,
          #0b0615 42%,
          #11091e 70%,
          #05040b 100%
        );
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      opacity:.32;

      background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#e9bf68 .8px,transparent .8px);

      background-size:
        95px 95px,
        145px 145px;

      background-position:
        10px 20px,
        50px 70px;
    }

    body::after{
      content:"";
      position:fixed;
      width:500px;
      height:500px;
      left:50%;
      top:35%;
      transform:translate(-50%,-50%);
      pointer-events:none;
      z-index:-1;

      background:radial-gradient(
        circle,
        rgba(233,191,104,.055),
        transparent 65%
      );

      filter:blur(15px);
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .topbar{
      text-align:center;
      padding:9px 15px;

      font-size:12px;
      letter-spacing:2px;
      color:#f8dfaa;

      background:rgba(0,0,0,.28);
      border-bottom:1px solid rgba(233,191,104,.12);
    }

    nav{
      position:sticky;
      top:0;
      z-index:1000;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:14px 5%;

      background:rgba(5,4,12,.72);
      backdrop-filter:blur(18px);

      border-bottom:1px solid rgba(233,191,104,.18);

      box-shadow:
        0 10px 30px rgba(0,0,0,.18);
    }

    .brand{
      font-size:23px;
      font-weight:800;
      letter-spacing:1px;

      color:var(--gold2);

      text-shadow:
        0 0 12px rgba(233,191,104,.28),
        0 0 30px rgba(141,91,211,.16);
    }

    .home-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:10px 20px;

      border-radius:30px;

      color:var(--gold2);

      border:1px solid rgba(233,191,104,.65);

      background:
        linear-gradient(
          135deg,
          rgba(233,191,104,.12),
          rgba(141,91,211,.08)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        0 8px 25px rgba(0,0,0,.25);

      transition:.35s;
    }

    .home-btn:hover{
      transform:translateY(-3px);
      color:#140e07;

      background:linear-gradient(
        135deg,
        #ffe5a1,
        #d99d45
      );

      box-shadow:
        0 12px 30px rgba(233,191,104,.25);
    }

    .hero{
      position:relative;
      max-width:1200px;
      margin:auto;

      padding:95px 20px 75px;

      text-align:center;
    }

    .orbit{
      position:absolute;

      width:360px;
      height:360px;

      left:50%;
      top:60px;

      transform:translateX(-50%);

      border:
        1px solid rgba(233,191,104,.14);

      border-radius:50%;

      box-shadow:
        0 0 80px rgba(141,91,211,.08),
        inset 0 0 60px rgba(233,191,104,.04);

      animation:orbitSpin 20s linear infinite;

      pointer-events:none;
    }

    .orbit::before{
      content:"✦";

      position:absolute;
      left:50%;
      top:-15px;

      color:var(--gold2);
      font-size:22px;

      text-shadow:
        0 0 10px var(--gold),
        0 0 30px var(--gold);

      transform:translateX(-50%);
    }

    .orbit::after{
      content:"✧";

      position:absolute;
      right:-9px;
      bottom:35px;

      color:#b58ae9;
      font-size:24px;

      text-shadow:
        0 0 12px #8d5bd3;
    }

    @keyframes orbitSpin{
      from{
        transform:translateX(-50%) rotate(0deg);
      }

      to{
        transform:translateX(-50%) rotate(360deg);
      }
    }

    .eyebrow{
      position:relative;
      z-index:2;

      display:inline-block;

      padding:8px 19px;

      border-radius:40px;

      color:var(--gold2);

      font-size:12px;
      letter-spacing:2.5px;

      border:1px solid rgba(233,191,104,.3);

      background:
        linear-gradient(
          135deg,
          rgba(233,191,104,.08),
          rgba(141,91,211,.08)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 10px 30px rgba(0,0,0,.18);

      margin-bottom:28px;
    }

    .main-title{
      position:relative;
      z-index:2;

      display:inline-block;

      font-size:clamp(46px,8vw,94px);

      line-height:1.05;

      font-weight:900;

      letter-spacing:1px;

      margin-bottom:27px;

      background:
        linear-gradient(
          180deg,
          #fffdf0 0%,
          #fff0b5 16%,
          #e9bf68 38%,
          #bd7d31 60%,
          #fff0b8 79%,
          #9c6126 100%
        );

      -webkit-background-clip:text;
      background-clip:text;

      color:transparent;

      text-shadow:
        0 2px 0 #82551f,
        0 4px 0 #613d17,
        0 7px 0 #39230e,
        0 10px 20px rgba(0,0,0,.8),
        0 0 30px rgba(233,191,104,.32),
        0 0 65px rgba(141,91,211,.18);

      filter:
        drop-shadow(0 10px 10px rgba(0,0,0,.45));

      animation:
        titleFloat 4s ease-in-out infinite;
    }

    .main-title::before{
      content:"";

      position:absolute;

      left:50%;
      top:50%;

      width:120%;
      height:120%;

      transform:translate(-50%,-50%);

      background:
        radial-gradient(
          ellipse,
          rgba(233,191,104,.10),
          transparent 65%
        );

      filter:blur(18px);

      z-index:-1;
    }

    .main-title::after{
      content:"";

      position:absolute;

      left:50%;
      bottom:-17px;

      width:210px;
      height:3px;

      transform:translateX(-50%);

      border-radius:50%;

      background:
        linear-gradient(
          90deg,
          transparent,
          #ffe5a1,
          #e9bf68,
          #ffe5a1,
          transparent
        );

      box-shadow:
        0 0 10px #e9bf68,
        0 0 28px rgba(233,191,104,.55);
    }

    @keyframes titleFloat{
      0%,100%{
        transform:
          translateY(0)
          perspective(800px)
          rotateX(0deg);
      }

      50%{
        transform:
          translateY(-6px)
          perspective(800px)
          rotateX(2deg);
      }
    }

    .hero h2{
      position:relative;
      z-index:2;

      color:#e9dff2;

      font-size:clamp(17px,3vw,27px);

      font-weight:400;

      margin-bottom:18px;
    }

    .hero-text{
      position:relative;
      z-index:2;

      max-width:820px;

      margin:auto;

      color:var(--muted);

      font-size:16px;
    }

    .contact-buttons{
      position:relative;
      z-index:3;

      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;

      gap:13px;

      margin-top:32px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:12px 24px;

      border-radius:30px;

      font-family:inherit;
      font-size:14px;

      border:1px solid transparent;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 8px 25px rgba(0,0,0,.28);

      transition:.35s;
    }

    .btn:hover{
      transform:translateY(-4px) scale(1.02);

      box-shadow:
        0 14px 35px rgba(0,0,0,.38),
        0 0 25px rgba(233,191,104,.14);
    }

    .whatsapp{
      color:#041b0d;

      background:
        linear-gradient(
          135deg,
          #5df28f,
          #25d366
        );

      border-color:#62ef91;

      box-shadow:
        0 10px 28px rgba(37,211,102,.18);
    }

    .instagram{
      color:#ffe9bc;

      background:
        linear-gradient(
          135deg,
          rgba(233,191,104,.12),
          rgba(141,91,211,.12)
        );

      border-color:rgba(233,191,104,.55);
    }

    .home{
      color:#fff;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.07),
          rgba(141,91,211,.08)
        );

      border-color:rgba(255,255,255,.25);
    }

    .container{
      width:min(1100px,92%);
      margin:auto;
    }

    .content-card{
      position:relative;

      overflow:hidden;

      margin-bottom:35px;

      padding:42px;

      border-radius:28px;

      background:
        linear-gradient(
          145deg,
          rgba(27,19,44,.82),
          rgba(11,8,20,.75)
        );

      border:1px solid rgba(233,191,104,.20);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 25px 70px rgba(0,0,0,.42);

      backdrop-filter:blur(18px);
    }

    .content-card::before{
      content:"";

      position:absolute;

      width:250px;
      height:250px;

      right:-100px;
      top:-120px;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(233,191,104,.09),
          transparent 70%
        );

      pointer-events:none;
    }

    .section-title{
      position:relative;

      color:var(--gold2);

      font-size:30px;

      margin-bottom:18px;

      text-shadow:
        0 2px 12px rgba(233,191,104,.16);
    }

    .section-title::after{
      content:"";

      display:block;

      width:75px;
      height:2px;

      margin-top:9px;

      background:
        linear-gradient(
          90deg,
          var(--gold),
          transparent
        );
    }

    .content-card p{
      color:var(--muted);
      margin-bottom:18px;
    }

    .highlight{
      color:#fff2c8;
      font-weight:bold;
    }

    .topic-grid,
    .benefits-grid,
    .related-grid{
      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:18px;

      margin-top:28px;
    }

    .topic,
    .benefit,
    .related{
      position:relative;

      overflow:hidden;

      padding:25px;

      border-radius:21px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.018)
        );

      border:1px solid rgba(233,191,104,.18);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 13px 35px rgba(0,0,0,.27);

      transition:.4s;

      transform:
        perspective(900px)
        translateZ(0);
    }

    .topic::before,
    .benefit::before,
    .related::before{
      content:"";

      position:absolute;

      width:120px;
      height:120px;

      top:-70px;
      right:-60px;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(233,191,104,.10),
          transparent 70%
        );
    }

    .topic:hover,
    .benefit:hover,
    .related:hover{
      transform:
        perspective(900px)
        translateY(-8px)
        rotateX(2deg);

      border-color:
        rgba(233,191,104,.62);

      box-shadow:
        0 20px 45px rgba(0,0,0,.38),
        0 0 28px rgba(233,191,104,.10);
    }

    .icon{
      font-size:31px;
      margin-bottom:10px;

      filter:
        drop-shadow(0 4px 8px rgba(0,0,0,.4));
    }

    .topic h3,
    .benefit h3,
    .related h3{
      position:relative;

      color:var(--gold2);

      font-size:18px;

      margin-bottom:8px;
    }

    .topic p,
    .benefit p,
    .related p{
      font-size:14px;
      margin:0;
    }

    .steps{
      display:grid;
      gap:16px;
      margin-top:25px;
    }

    .step{
      display:flex;
      gap:18px;
      align-items:flex-start;

      padding:21px;

      border-left:
        2px solid var(--gold);

      border-radius:
        0 17px 17px 0;

      background:
        linear-gradient(
          90deg,
          rgba(233,191,104,.07),
          rgba(233,191,104,.015)
        );
    }

    .step-number{
      min-width:40px;
      height:40px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      color:var(--gold2);

      border:1px solid var(--gold);

      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255,255,255,.16),
          rgba(233,191,104,.08)
        );

      box-shadow:
        0 0 18px rgba(233,191,104,.12);
    }

    .step h3{
      color:#fff;
      margin-bottom:5px;
      font-size:18px;
    }

    .note{
      margin-top:26px;

      padding:21px;

      border-radius:18px;

      color:#ded5e7;

      background:
        linear-gradient(
          135deg,
          rgba(233,191,104,.055),
          rgba(141,91,211,.055)
        );

      border:
        1px solid rgba(233,191,104,.20);
    }

    .note strong{
      color:var(--gold2);
    }

    .cta{
      position:relative;
      overflow:hidden;

      text-align:center;

      padding:55px 25px;

      margin:48px 0;

      border-radius:30px;

      border:
        1px solid rgba(233,191,104,.25);

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(233,191,104,.12),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          rgba(19,12,34,.92),
          rgba(8,6,15,.90)
        );

      box-shadow:var(--shadow);
    }

    .cta::before{
      content:"✦";

      position:absolute;

      left:12%;
      top:25%;

      color:var(--gold);

      font-size:25px;

      animation:twinkle 2.5s ease-in-out infinite;
    }

    .cta::after{
      content:"✧";

      position:absolute;

      right:12%;
      bottom:25%;

      color:#a77bd7;

      font-size:28px;

      animation:twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle{
      0%,100%{
        opacity:.3;
        transform:scale(.8);
      }

      50%{
        opacity:1;
        transform:scale(1.25);
      }
    }

    .cta h2{
      position:relative;
      z-index:2;

      color:var(--gold2);

      font-size:34px;

      margin-bottom:13px;

      text-shadow:
        0 0 22px rgba(233,191,104,.18);
    }

    .cta p{
      position:relative;
      z-index:2;

      max-width:700px;

      margin:0 auto 27px;

      color:var(--muted);
    }

    footer{
      margin-top:25px;

      padding:30px 15px;

      text-align:center;

      color:#aaa1b5;

      font-size:13px;

      border-top:
        1px solid rgba(233,191,104,.15);

      background:
        rgba(0,0,0,.12);
    }

    .floating-wa{
      position:fixed;

      right:20px;
      bottom:20px;

      z-index:2000;

      width:59px;
      height:59px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      color:#041b0d;

      font-size:27px;

      background:
        linear-gradient(
          145deg,
          #63f69a,
          #25d366
        );

      border:2px solid rgba(255,255,255,.25);

      box-shadow:
        0 12px 35px rgba(37,211,102,.30);

      transition:.3s;

      animation:
        whatsappPulse 3s ease-in-out infinite;
    }

    .floating-wa:hover{
      transform:scale(1.1);
    }

    @keyframes whatsappPulse{
      0%,100%{
        box-shadow:
          0 12px 35px rgba(37,211,102,.28);
      }

      50%{
        box-shadow:
          0 12px 45px rgba(37,211,102,.48);
      }
    }

    @media(max-width:850px){

      .topic-grid,
      .benefits-grid,
      .related-grid{
        grid-template-columns:1fr 1fr;
      }

      .content-card{
        padding:30px 25px;
      }

      .orbit{
        width:280px;
        height:280px;
      }
    }

    @media(max-width:560px){

      .topbar{
        font-size:10px;
        letter-spacing:1.2px;
      }

      nav{
        padding:12px 4%;
      }

      .brand{
        font-size:18px;
      }

      .home-btn{
        padding:8px 15px;
        font-size:13px;
      }

      .hero{
        padding:70px 15px 55px;
      }

      .orbit{
        width:235px;
        height:235px;
        top:75px;
      }

      .main-title{
        font-size:48px;
      }

      .hero h2{
        font-size:18px;
      }

      .hero-text{
        font-size:14px;
      }

      .contact-buttons{
        gap:10px;
      }

      .btn{
        width:100%;
        max-width:290px;
      }

      .container{
        width:92%;
      }

      .content-card{
        padding:25px 18px;
        border-radius:22px;
      }

      .section-title{
        font-size:25px;
      }

      .topic-grid,
      .benefits-grid,
      .related-grid{
        grid-template-columns:1fr;
      }

      .cta{
        padding:42px 18px;
      }

      .cta h2{
        font-size:27px;
      }

      .floating-wa{
        width:55px;
        height:55px;
        right:15px;
        bottom:15px;
      }
    }
  </style>

<body>

  <div class
