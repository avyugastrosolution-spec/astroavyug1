<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarot Reading | Astro Avyug</title>
<meta name="description" content="Personalized Tarot Reading with Astro Avyug for reflection, relationships, career and personal questions.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://astroavyug.com/services/tarot-reading.html">
<style>
:root{--bg:#07050d;--panel:#151022;--gold:#e9bf68;--gold2:#fff0b8;--purple:#9a68dc;--muted:#d8d0e4;--line:rgba(233,191,104,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{min-height:100vh;color:#fff;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(130,70,200,.2),transparent 28%),radial-gradient(circle at 90% 15%,rgba(55,90,190,.16),transparent 28%),linear-gradient(145deg,#030208,#0b0615 55%,#12091f);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.25;background-image:radial-gradient(circle,#fff 1px,transparent 1.4px),radial-gradient(circle,var(--gold) 1px,transparent 1.4px);background-size:150px 150px,240px 240px;background-position:0 0,70px 90px}
.nav,header,main,footer,.wa{position:relative;z-index:2}
.nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 6%;background:rgba(5,4,11,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{font-weight:900;font-size:21px;color:var(--gold2);white-space:nowrap}
.links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.links a{color:#eee;text-decoration:none;font-size:12px;font-weight:700;padding:8px 10px;border-radius:22px}
.links a:hover{background:var(--gold);color:#111}
.hero{max-width:1100px;margin:auto;text-align:center;padding:68px 6% 52px}
.symbol{width:88px;height:88px;margin:0 auto 22px;border:1px solid rgba(233,191,104,.5);border-radius:50%;display:grid;place-items:center;font-size:42px;background:rgba(233,191,104,.08);box-shadow:0 0 30px rgba(233,191,104,.12)}
.eyebrow{display:inline-block;padding:8px 15px;border:1px solid var(--line);border-radius:30px;color:var(--gold2);font-size:11px;font-weight:800;letter-spacing:1.3px}
h1{margin-top:18px;font-size:clamp(46px,8vw,88px);line-height:1;font-weight:900;letter-spacing:-3px;background:linear-gradient(#fff,var(--gold2) 35%,var(--gold) 65%,#9b6b2b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 5px 18px rgba(0,0,0,.7)}
.subtitle{margin:18px auto 10px;font-size:clamp(18px,3vw,25px);font-weight:800}
.hero p{max-width:740px;margin:auto;color:var(--muted);line-height:1.8}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:145px;padding:13px 20px;border-radius:30px;text-decoration:none;font-weight:800;font-size:14px;color:#111;background:linear-gradient(135deg,var(--gold),var(--gold2));border:1px solid rgba(255,255,255,.12)}
.btn.alt{color:#fff;background:rgba(100,70,150,.45);border-color:var(--line)}
.container{position:relative;z-index:3;width:min(1080px,92%);margin:auto}
.card{margin:22px 0;padding:30px;border:1px solid var(--line);border-radius:25px;background:rgba(20,13,32,.9);box-shadow:0 20px 55px rgba(0,0,0,.35)}
.card h2{color:var(--gold2);font-size:27px;margin-bottom:15px}
.card p{color:var(--muted);line-height:1.8;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.topic{padding:22px;border:1px solid rgba(233,191,104,.15);border-radius:20px;background:rgba(255,255,255,.035)}
.topic .icon{font-size:27px;margin-bottom:12px}.topic h3{font-size:17px;margin-bottom:7px}.topic p{font-size:13px;margin:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.step{text-align:center;padding:20px;border:1px solid rgba(233,191,104,.15);border-radius:20px;background:rgba(255,255,255,.03)}
.num{width:42px;height:42px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-weight:900}.step p{font-size:13px;margin:0}
.note{margin-top:18px;padding:17px 19px;border-left:3px solid var(--gold);background:rgba(233,191,104,.055);color:var(--muted);line-height:1.7;border-radius:0 14px 14px 0}
.related{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.related a{padding:17px;border:1px solid rgba(233,191,104,.15);border-radius:18px;color:#fff;text-decoration:none;background:rgba(255,255,255,.03)}.related strong{display:block;color:var(--gold2);margin-bottom:5px}.related span{font-size:12px;color:var(--muted)}
.cta{text-align:center;margin:25px 0 50px;padding:38px 22px;border:1px solid var(--line);border-radius:27px;background:linear-gradient(135deg,rgba(146,91,214,.14),rgba(69,111,208,.1))}.cta h2{color:var(--gold2);font-size:32px;margin-bottom:10px}.cta p{color:var(--muted);line-height:1.7}
.wa{position:fixed;right:18px;bottom:18px;z-index:20;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#25d366;color:#fff;font-size:27px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
footer{text-align:center;padding:28px 18px 40px;border-top:1px solid rgba(233,191,104,.13);background:rgba(0,0,0,.25)}footer .fbrand{font-size:21px;font-weight:900;color:var(--gold2);margin-bottom:8px}footer p{color:#aaa0b0;font-size:13px;line-height:1.7}.flinks{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:13px}.flinks a{color:#d8c8e6;text-decoration:none;font-size:12px}
@media(max-width:850px){.nav{flex-direction:column}.links{justify-content:center}.grid{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.related{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.nav{position:relative;padding:12px 8px}.links{gap:3px}.links a{padding:6px 7px;font-size:10px}.hero{padding:55px 16px 42px}.symbol{width:78px;height:78px;font-size:36px}h1{font-size:50px;letter-spacing:-2px}.subtitle{font-size:18px}.hero p{font-size:14px}.actions{flex-direction:column;align-items:center}.btn{width:100%;max-width:310px}.card{padding:22px 17px;border-radius:21px}.grid,.steps,.related{grid-template-columns:1fr}.card h2{font-size:23px}.cta h2{font-size:27px}}

/* === Premium Animated Tarot Cards === */
.tarot-showcase{display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap;margin:10px auto 34px;perspective:1200px}
.tarot-card{width:150px;height:230px;position:relative;flex:0 0 150px;perspective:1000px}
.tarot-card:nth-child(1){animation:cardFloat1 4.8s ease-in-out infinite}
.tarot-card:nth-child(2){animation:cardFloat2 5.4s ease-in-out infinite .4s}
.tarot-card:nth-child(3){animation:cardFloat3 5s ease-in-out infinite .8s}
.tarot-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tarot-card:hover .tarot-inner{transform:rotateY(180deg)}
.tarot-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid rgba(233,191,104,.58);overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.48),0 0 25px rgba(146,91,214,.16)}
.tarot-back{display:grid;place-items:center;background:
radial-gradient(circle at 50% 50%,rgba(233,191,104,.16),transparent 34%),
linear-gradient(145deg,#160d2c,#080611 65%,#1c1031)}
.tarot-back:before{content:"";position:absolute;inset:10px;border:1px solid rgba(233,191,104,.55);border-radius:13px;background:
linear-gradient(45deg,transparent 47%,rgba(233,191,104,.2) 49%,transparent 51%),
linear-gradient(-45deg,transparent 47%,rgba(233,191,104,.2) 49%,transparent 51%);
background-size:28px 28px;opacity:.75}
.tarot-back .back-symbol{position:relative;z-index:2;width:64px;height:64px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--gold2);background:rgba(8,6,17,.72);box-shadow:0 0 28px rgba(233,191,104,.3)}
.tarot-front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;background:
radial-gradient(circle at 50% 20%,rgba(255,240,184,.16),transparent 30%),
linear-gradient(160deg,#24113f,#0a0712 70%)}
.tarot-front .mini-symbol{font-size:42px;margin-bottom:13px;filter:drop-shadow(0 0 10px rgba(233,191,104,.55))}
.tarot-front strong{color:var(--gold2);font-size:16px;letter-spacing:.5px}
.tarot-front span{color:#cfc4dc;font-size:11px;line-height:1.5;margin-top:7px}
.tarot-card:after{content:"";position:absolute;inset:-2px;border-radius:20px;pointer-events:none;box-shadow:0 0 0 rgba(233,191,104,0);animation:cardGlow 3.5s ease-in-out infinite}
@keyframes cardFloat1{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(-1deg)}}
@keyframes cardFloat2{0%,100%{transform:translateY(2px) rotate(1deg)}50%{transform:translateY(-14px) rotate(0deg)}}
@keyframes cardFloat3{0%,100%{transform:translateY(0) rotate(3deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes cardGlow{0%,100%{box-shadow:0 0 0 rgba(233,191,104,0)}50%{box-shadow:0 0 28px rgba(233,191,104,.16)}}
.symbol{animation:symbolPulse 3.2s ease-in-out infinite}
@keyframes symbolPulse{0%,100%{box-shadow:0 0 30px rgba(233,191,104,.12);transform:scale(1)}50%{box-shadow:0 0 48px rgba(233,191,104,.28);transform:scale(1.025)}}
h1{animation:titleGlow 3.8s ease-in-out infinite}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 5px 18px rgba(0,0,0,.7))}50%{filter:drop-shadow(0 0 22px rgba(233,191,104,.22))}}
.btn{position:relative;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .7s ease}
.btn:hover:after{left:135%}
.topic,.step,.related a{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.topic:hover,.step:hover,.related a:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.3);border-color:rgba(233,191,104,.38)}
@media(max-width:560px){
 .tarot-showcase{gap:12px;margin-bottom:28px}
 .tarot-card{width:100px;height:155px;flex-basis:100px}
 .tarot-back .back-symbol{width:46px;height:46px;font-size:21px}
 .tarot-front{padding:10px}
 .tarot-front .mini-symbol{font-size:28px;margin-bottom:7px}
 .tarot-front strong{font-size:11px}
 .tarot-front span{font-size:8px}
}
@media(prefers-reduced-motion:reduce){
 .tarot-card,.tarot-card:nth-child(1),.tarot-card:nth-child(2),.tarot-card:nth-child(3),.symbol,h1,.tarot-card:after{animation:none!important}
 .tarot-inner{transition:none}
 .btn:after{display:none}
}

/* === Astro Avyug Enhanced Cosmic Motion === */
body:after{content:"";position:fixed;inset:-30%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg,transparent,rgba(154,104,220,.06),transparent 28%,rgba(233,191,104,.05),transparent 58%);animation:cosmicSpin 32s linear infinite}
@keyframes cosmicSpin{to{transform:rotate(360deg)}}
.brand{display:flex;align-items:center;gap:9px}.brand-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid rgba(233,191,104,.65);box-shadow:0 0 18px rgba(233,191,104,.2);animation:logoGlow 3s ease-in-out infinite}

@keyframes orbitRing{to{transform:rotate(360deg)}}@keyframes orbitDot{to{transform:rotate(360deg)}}@keyframes logoGlow{0%,100%{box-shadow:0 0 18px rgba(233,191,104,.18)}50%{box-shadow:0 0 34px rgba(233,191,104,.42),0 0 55px rgba(154,104,220,.16)}}
.eyebrow{animation:eyebrowFloat 4s ease-in-out infinite}@keyframes eyebrowFloat{50%{transform:translateY(-4px);box-shadow:0 0 22px rgba(233,191,104,.12)}}
.card{transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease}.card:hover{transform:translateY(-5px);border-color:rgba(233,191,104,.38);box-shadow:0 24px 65px rgba(0,0,0,.42),0 0 25px rgba(154,104,220,.08)}
.tarot-showcase:before{content:"✦  ✧  ✦  ✧  ✦";position:absolute;color:rgba(255,240,184,.25);letter-spacing:18px;font-size:15px;animation:sparkleDrift 7s ease-in-out infinite;pointer-events:none}.tarot-showcase{position:relative}@keyframes sparkleDrift{0%,100%{transform:translateY(118px) scale(.9);opacity:.18}50%{transform:translateY(-80px) scale(1.08);opacity:.55}}
.tarot-card{cursor:pointer}.tarot-card:hover{z-index:5}.tarot-card:hover:after{box-shadow:0 0 42px rgba(233,191,104,.3)} ho 
.wa{animation:waPulse 2.4s ease-in-out infinite}@keyframes waPulse{0%,100%{transform:scale(1);box-shadow:0 8px 30px rgba(0,0,0,.4)}50%{transform:scale(1.07);box-shadow:0 8px 34px rgba(37,211,102,.34)}}
@media(max-width:560px){.brand-logo{width:32px;height:32px}.hero-logo{width:96px;height:96px}.hero-logo img{width:78px;height:78px}.orbit-star{transform-origin:4px 48px}.tarot-showcase:before{letter-spacing:10px}}
@media(prefers-reduced-motion:reduce){body:after,.brand-logo,.hero-logo img,.hero-logo:before,.hero-logo:after,.orbit-star,.eyebrow,.wa,.tarot-showcase:before{animation:none!important}}


/* === Astro Avyug Mixed-Color Text Upgrade === */
.brand,.fbrand,h1,.card h2,.cta h2{
 background:linear-gradient(90deg,#ffd76a,#ff78c8,#8f8cff,#67e8f9,#7dffb2,#ffd76a);
 background-size:300% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;

@keyframes avyugTextFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
